<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataAgent 智能分析</title>
  <style>
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      max-width: 960px;
      margin: 48px auto;
      padding: 0 20px;
      color: #243247;
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 100px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { cursor: wait; }
    #exportButton { margin: 0 0 12px; }
    #message { margin: 20px 0; }
    #chart { margin: 24px 0; }
    #chart h2 { font-size: 20px; }
    .chart-note { color: #596779; font-size: 14px; }
    .chart-row {
      display: grid;
      grid-template-columns: minmax(100px, 180px) minmax(0, 1fr) 72px;
      gap: 12px;
      align-items: center;
      margin: 14px 0;
    }
    .chart-label { overflow-wrap: anywhere; }
    .chart-track { background: #edf2fa; border-radius: 4px; }
    .chart-bar { height: 24px; background: #2563eb; border-radius: 4px; }
    .chart-count { text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 540px) {
      .chart-row { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) 60px; gap: 8px; }
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      border: 1px solid #d9dfe7;
      padding: 12px;
      text-align: left;
    }
    th { background: #f2f5f9; }
    details { margin-top: 24px; }
    pre {
      background: #f2f5f9;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>DataAgent 智能分析</h1>
  <p>输入问题，系统会生成分析计划并计算结果。</p>

  <form id="askForm">
    <textarea id="question" aria-label="分析问题" placeholder="例如：数据分析师岗位最多的前五个国家是哪些？">数据分析师岗位最多的前五个国家是哪些？请合并国家别名后统计。</textarea>
    <button id="askButton" type="submit">开始分析</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p id="answer" hidden></p>
  <section id="chart" aria-label="岗位记录数条形图" hidden></section>
  <button id="exportButton" type="button" hidden disabled>导出 CSV</button>
  <div id="result" class="table-wrap"></div>

  <details id="planDetails" hidden>
    <summary>查看分析计划</summary>
    <pre id="plan"></pre>
  </details>

  <script>
    const form = document.getElementById("askForm");
    const questionInput = document.getElementById("question");
    const button = document.getElementById("askButton");
    const message = document.getElementById("message");
    const resultBox = document.getElementById("result");
    const planBox = document.getElementById("plan");
    const planDetails = document.getElementById("planDetails");
    const chartBox = document.getElementById("chart");
    const answerBox = document.getElementById("answer");
    const exportButton = document.getElementById("exportButton");
    let exportRows = [];

    function resetExport() {
      exportRows = [];
      exportButton.disabled = true;
      exportButton.hidden = true;
    }

    function prepareExport(result) {
      resetExport();
      const rows = Array.isArray(result) ? result : [result];
      if (!rows.length || !rows.every(row => row && typeof row === "object" &&
          !Array.isArray(row))) return;
      if (!rows.some(row => Object.keys(row).length)) return;
      exportRows = rows;
      exportButton.disabled = false;
      exportButton.hidden = false;
    }

    function csvCell(value, column) {
      let text = value === null || value === undefined ? "" : displayValue(value, column);
      // 文本只作为文本导出，避免电子表格将数据当作公式执行。
      if (typeof value !== "number" && (/^[\s\uFEFF]*[=+@-]/.test(text) || /^[\t\r\n]/.test(text))) {
        text = "'" + text;
      }
      return '"' + text.replace(/"/g, '""') + '"';
    }

    function buildCsv(rows) {
      const columns = [...new Set(rows.flatMap(row => Object.keys(row)))];
      const lines = [columns.map(column => csvCell(fieldName(column), "")).join(",")];
      for (const row of rows) {
        lines.push(columns.map(column => csvCell(row[column], column)).join(","));
      }
      // UTF-8 BOM 便于 Excel 识别中文；采用 CSV 标准引号转义与换行。
      return "\uFEFF" + lines.join("\r\n") + "\r\n";
    }

    exportButton.addEventListener("click", () => {
      if (exportButton.disabled || !exportRows.length) return;
      const blob = new Blob([buildCsv(exportRows)], {type: "text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const now = new Date();
      const stamp = [now.getFullYear(), now.getMonth() + 1, now.getDate(),
        now.getHours(), now.getMinutes(), now.getSeconds()]
        .map(value => String(value).padStart(2, "0")).join("");
      link.href = url;
      link.download = `分析结果_${stamp}.csv`;
      document.body.appendChild(link);
      try {
        link.click();
      } finally {
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    });
    const fieldNames = {
      title: "岗位名称", normalized_title: "标准岗位名称", company_name: "公司名称",
      country: "国家（原始值）", country_clean: "国家", count: "记录数",
      skills_required: "技能要求", industry: "行业", function: "职能",
      occupational_category: "职业类别", employment_type: "雇佣类型",
      work_model: "工作方式", schedule: "工作时间", shift: "班次",
      experience_level: "经验级别", job_level_normalized: "标准岗位级别",
      years_experience_numeric: "工作年限", education_level: "学历要求",
      minimum_qualifications: "最低任职要求", preferred_qualifications: "优先条件",
      responsibilities: "岗位职责", certifications: "证书要求", languages_required: "语言要求",
      salary_min: "薪资下限", salary_max: "薪资上限", salary_currency: "薪资币种",
      salary_rate_unit: "薪资周期", salary_type: "薪资类型", pay_frequency: "发薪频率",
      bonus: "奖金", equity: "股权", on_target_earnings: "目标总收入", benefits: "福利",
      city: "城市", location_resolved: "标准工作地点", locations: "工作地点",
      remote_eligibility_regions: "远程工作适用地区", latitude: "纬度", longitude: "经度",
      visa_sponsorship_available: "是否提供签证支持", work_authorization_requirements: "工作许可要求",
      security_clearance: "安全审查要求", relocation_assistance: "搬迁支持",
      travel_required: "是否需要出差", travel_percentage: "出差比例", date_posted: "发布日期",
      closing_date: "截止日期", job_description: "岗位描述", ats_name: "招聘系统",
      column: "统计字段", mean: "平均值", median: "中位数", min: "最小值", max: "最大值"
    };
    const countryNames = {
      "united states": "美国", "united states of america": "美国", usa: "美国", us: "美国",
      "united kingdom": "英国", uk: "英国", "u.k.": "英国", gb: "英国",
      india: "印度", france: "法国", germany: "德国", canada: "加拿大",
      china: "中国", japan: "日本", australia: "澳大利亚", singapore: "新加坡",
      netherlands: "荷兰", ireland: "爱尔兰", spain: "西班牙", italy: "意大利",
      switzerland: "瑞士", sweden: "瑞典", poland: "波兰", brazil: "巴西",
      mexico: "墨西哥", "south korea": "韩国", "new zealand": "新西兰",
      "united arab emirates": "阿联酋", "south africa": "南非", israel: "以色列"
    };
    const jobNames = {
      "data analyst": "数据分析师", "data scientist": "数据科学家",
      "data engineer": "数据工程师", "software engineer": "软件工程师"
    };
    const regionNames = typeof Intl.DisplayNames === "function"
      ? new Intl.DisplayNames(["zh-CN"], {type: "region"}) : null;

    function fieldName(column) {
      return Object.hasOwn(fieldNames, column) ? fieldNames[column] : column;
    }

    function countryName(value) {
      const text = String(value).trim();
      const key = text.toLowerCase();
      if (Object.hasOwn(countryNames, key)) return countryNames[key];
      if (regionNames && /^[a-z]{2}$/i.test(text)) return regionNames.of(text.toUpperCase());
      return text;
    }

    function renderPlan(plan) {
      const lines = (plan.tool_calls || []).map((call, index) => {
        const args = call.arguments || {};
        const column = fieldName(args.column || "");
        let description;
        if (call.name === "filter_rows") {
          description = `筛选「${column}」中包含「${displayValue(args.keyword, args.column)}」的记录。`;
        } else if (call.name === "count_values") {
          description = `按「${column}」统计记录数，忽略缺失值，按数量从高到低取前 ${args.top_n ?? 10} 项。`;
        } else if (call.name === "summarize_numeric") {
          description = `计算「${column}」的有效数量、平均值、中位数、最小值和最大值。`;
        } else {
          description = "执行数据处理步骤。";
        }
        return `第 ${index + 1} 步：${description}`;
      });
      planBox.textContent = lines.join("\n\n");
    }

    function renderAnswer(step) {
      answerBox.hidden = true;
      answerBox.textContent = "";
      const rows = step.result;
      const column = step.arguments?.column;
      if (step.tool !== "count_values" || !column || !Array.isArray(rows) ||
          !rows.length || !rows.every(row => row && Number.isFinite(row.count))) return;
      const highest = Math.max(...rows.map(row => row.count));
      const leaders = rows.filter(row => row.count === highest)
        .map(row => displayValue(row[column], column));
      answerBox.textContent = `本次返回 ${rows.length} 项统计结果。其中，${leaders.join("、")}` +
        `${leaders.length > 1 ? "并列" : ""}最多，为 ${highest.toLocaleString("zh-CN")} 条记录。`;
      answerBox.hidden = false;
    }

    function clearChart() {
      chartBox.replaceChildren();
      chartBox.hidden = true;
    }

    function renderChart(step) {
      clearChart();
      const rows = step.result;
      const column = step.arguments?.column;
      if (step.tool !== "count_values" || !column ||
          !Array.isArray(rows) || rows.length === 0) return;
      if (!rows.every(row => row && Object.hasOwn(row, column) &&
          Number.isFinite(row.count) && row.count >= 0)) return;

      const shown = [...rows].sort((a, b) => b.count - a.count).slice(0, 20);
      const maximum = shown[0].count;
      const heading = document.createElement("h2");
      heading.textContent = "岗位记录数对比";
      const note = document.createElement("p");
      note.className = "chart-note";
      note.textContent = "条形从 0 开始，长度表示记录数。" +
        (rows.length > 20 ? "图表仅显示前 20 项，完整结果见下方表格。" : "");
      chartBox.append(heading, note);

      for (const row of shown) {
        const item = document.createElement("div");
        item.className = "chart-row";
        const label = document.createElement("span");
        label.className = "chart-label";
        label.textContent = displayValue(row[column], column);
        const track = document.createElement("div");
        track.className = "chart-track";
        track.setAttribute("aria-hidden", "true");
        const bar = document.createElement("div");
        bar.className = "chart-bar";
        bar.style.width = `${maximum > 0 ? row.count / maximum * 100 : 0}%`;
        track.appendChild(bar);
        const count = document.createElement("span");
        count.className = "chart-count";
        count.textContent = row.count.toLocaleString("zh-CN");
        item.append(label, track, count);
        chartBox.appendChild(item);
      }
      chartBox.hidden = false;
    }

    function displayValue(value, column = "") {
      if (value === null || value === undefined) return "—";
      if (column === "country" || column === "country_clean") return countryName(value);
      if (column === "column") return fieldName(value);
      if (typeof value === "boolean") return value ? "是" : "否";
      if ((column === "title" || column === "normalized_title") && typeof value === "string") {
        return value.replace(/Data Analyst|Data Scientist|Data Engineer|Software Engineer/gi,
          match => jobNames[match.toLowerCase()]);
      }
      return typeof value === "object"
        ? JSON.stringify(value)
        : String(value);
    }

    function renderResult(result) {
      resultBox.replaceChildren();
      resetExport();

      if (!Array.isArray(result)) {
        const pre = document.createElement("pre");
        pre.textContent = result && typeof result === "object"
          ? Object.entries(result).map(([key, value]) => `${fieldName(key)}：${displayValue(value, key)}`).join("\n")
          : displayValue(result);
        resultBox.appendChild(pre);
        prepareExport(result);
        return;
      }

      if (result.length === 0) {
        resultBox.textContent = "没有符合条件的记录。";
        return;
      }

      const columns = [...new Set(
        result.flatMap(row => Object.keys(row))
      )];
      const table = document.createElement("table");
      const header = table.createTHead().insertRow();

      for (const column of columns) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = fieldName(column);
        header.appendChild(cell);
      }

      const body = table.createTBody();
      for (const row of result) {
        const tableRow = body.insertRow();
        for (const column of columns) {
          tableRow.insertCell().textContent = displayValue(row[column], column);
        }
      }

      resultBox.appendChild(table);
      prepareExport(result);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = questionInput.value.trim();
      resetExport();
      clearChart();
      answerBox.textContent = "";
      answerBox.hidden = true;
      resultBox.replaceChildren();
      planBox.textContent = "";
      planDetails.hidden = true;

      if (!question) {
        message.textContent = "请先输入问题。";
        return;
      }

      button.disabled = true;
      message.textContent = "正在生成计划并分析，请稍候……";

      try {
        const response = await fetch("/agent/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question})
        });

        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(`服务器返回了非 JSON 响应（HTTP ${response.status}）`);
        }

        if (!response.ok) {
          throw new Error(
            typeof data.detail === "string"
              ? data.detail
              : JSON.stringify(data.detail || data)
          );
        }
if (
  data.status === "cannot_answer" ||
  data.status === "needs_clarification"
) {
  message.textContent =
    data.status === "needs_clarification"
      ? "需要补充信息"
      : "当前无法完成此分析";

  answerBox.textContent = data.message;
  answerBox.hidden = false;
  return;
}
        if (!Array.isArray(data.steps) || data.steps.length === 0) {
          throw new Error("服务器没有返回执行步骤。");
        }

        renderPlan(data.plan);
        planDetails.hidden = false;

        const lastStep = data.steps[data.steps.length - 1];
        renderResult(lastStep.result);
        renderChart(lastStep);
        renderAnswer(lastStep);
        message.textContent = `分析完成，共执行 ${data.steps.length} 个步骤。`;
      } catch (error) {
        resetExport();
        message.textContent = `分析失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
