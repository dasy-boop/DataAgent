<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataAgent｜智能招聘数据分析</title>
  <style>
    :root{color-scheme:light;--ink:#17231f;--muted:#778079;--green:#244d3c;--line:rgba(42,54,47,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(ellipse at 73% 2%,rgba(255,255,255,.88),transparent 36%),radial-gradient(ellipse at 15% 56%,rgba(235,239,228,.7),transparent 35%),#f4f0eb}
    button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}[hidden]{display:none!important}
    .app-shell{min-height:100vh;padding:12px}.sidebar{position:fixed;z-index:5;inset:12px auto 12px 12px;width:240px;display:flex;flex-direction:column;padding:22px 14px 14px;border:1px solid rgba(255,255,255,.75);border-radius:24px;background:rgba(255,255,255,.48);backdrop-filter:blur(22px);box-shadow:0 10px 40px rgba(62,52,42,.035)}
    .brand{padding:0 12px 28px;font-size:25px;font-weight:750;letter-spacing:-.8px}.nav{display:grid;gap:6px}.nav-link{min-height:48px;display:flex;align-items:center;gap:14px;padding:0 13px;border-radius:15px;color:#4c5551;font-size:15px;transition:background .2s,color .2s,transform .2s}.nav-link:hover{background:rgba(255,255,255,.7);transform:translateX(2px)}.nav-link.active{color:var(--green);background:rgba(67,101,76,.09);font-weight:650}.nav-link svg{width:23px;height:23px;flex:0 0 auto}.sidebar-spacer{flex:1}.side-dataset{display:flex;gap:12px;align-items:center;padding:14px 12px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.58)}.dataset-icon{width:48px;height:48px;display:grid;place-items:center;flex:0 0 auto;border-radius:15px;background:#e9eee8;color:var(--green)}.dataset-icon svg{width:25px;height:25px}.side-dataset strong,.side-dataset small{display:block}.side-dataset strong{font-size:13px}.side-dataset small{margin-top:3px;color:var(--muted);font-size:12px}
    .main{min-width:0;margin-left:252px;padding-bottom:145px}.hero{min-height:290px;position:relative;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(255,255,255,.7);border-radius:24px;background:radial-gradient(circle at 0% -28%,transparent 0 175px,rgba(255,255,255,.68) 176px 177px,transparent 178px),radial-gradient(circle at 94% 145%,transparent 0 235px,rgba(255,255,255,.55) 236px 237px,transparent 238px),radial-gradient(circle at 38% 125%,transparent 0 180px,rgba(255,255,255,.42) 181px 182px,transparent 183px),linear-gradient(135deg,rgba(250,247,243,.82),rgba(231,231,228,.72))}.hero-copy{padding:20px;text-align:center}.hero-copy strong,.hero-copy span{display:block}.hero-copy strong{margin-bottom:7px;color:#28382f;font-size:27px}.hero-copy span{color:#5e675f;font-size:15px}.profile-link{position:absolute;top:22px;right:24px;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.62)}.profile-link svg{width:22px;height:22px}
    .content{padding:18px 12px 30px}.section-heading{margin:0 0 11px;font-size:18px;font-weight:720}.quick-grid{display:grid;grid-template-columns:1.08fr 1fr 1fr;grid-template-rows:112px 112px;gap:14px}.quick-card{position:relative;overflow:hidden;display:flex;gap:14px;align-items:flex-start;min-width:0;padding:17px;border:1px solid rgba(255,255,255,.8);border-radius:18px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(45,53,46,.025);transition:transform .2s,box-shadow .2s}.quick-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(45,53,46,.08)}.quick-card:first-child{grid-row:span 2;flex-direction:column}.tone-green{background:linear-gradient(135deg,#f2f3ed,#eaeee7)}.tone-blue{background:linear-gradient(135deg,#f1f1fa,#e9e9f5)}.tone-sand{background:linear-gradient(135deg,#f7f1e8,#f2e9dc)}.tone-lilac{background:linear-gradient(135deg,#f6eff5,#f1e9f1)}.tone-sky{background:linear-gradient(135deg,#edf3f5,#e7eef1)}.icon-circle{width:54px;height:54px;display:grid;place-items:center;flex:0 0 auto;border-radius:18px;background:rgba(255,255,255,.43);color:var(--green)}.icon-circle svg{width:25px;height:25px}.tone-blue .icon-circle{color:#416caf}.tone-sand .icon-circle{color:#7a6d58}.tone-lilac .icon-circle{color:#685a7b}.tone-sky .icon-circle{color:#456b83}.card-copy{min-width:0;padding-top:6px}.card-copy strong,.card-copy small{display:block}.card-copy strong{font-size:15px}.card-copy small{margin-top:5px;color:#778079;font-size:12px;line-height:1.5}.card-arrow{position:absolute;top:16px;right:15px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.68);color:#355746;font-size:21px}.card-deco{position:absolute;right:18px;bottom:12px;display:flex;gap:10px;align-items:end;opacity:.16}.card-deco i{width:23px;border-radius:8px;background:currentColor}.card-deco i:nth-child(1){height:28px}.card-deco i:nth-child(2){height:54px}.card-deco i:nth-child(3){height:76px}
    .dataset-strip{display:flex;align-items:center;gap:15px;margin-top:18px;padding:14px 18px;border:1px solid rgba(255,255,255,.82);border-radius:18px;background:rgba(255,255,255,.57);backdrop-filter:blur(12px)}.dataset-label small,.dataset-label strong{display:block}.dataset-label small{color:var(--muted);font-size:12px}.dataset-label strong{margin-top:2px;font-size:15px}.dataset-divider{width:1px;height:34px;margin:0 5px;background:#c9cec9}.dataset-count{color:#68716b;font-size:14px}.dataset-count strong{color:var(--ink);font-size:18px}.dataset-button{margin-left:auto;padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.7);color:var(--green);cursor:pointer}#overviewPanel{margin-top:12px;padding:18px;border:1px solid rgba(255,255,255,.85);border-radius:17px;background:rgba(255,255,255,.68)}#overviewPanel h3{margin:0 0 8px;font-size:16px}#overviewPanel p{margin:5px 0;color:#68716b;font-size:13px}#columnList{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}#columnList span{padding:5px 9px;border-radius:9px;background:#edf1ed;color:#52645a;font-size:12px}.footnote{padding:20px 4px 0;color:#8a908b;font-size:12px}
    .chat-heading{display:flex;align-items:center;justify-content:space-between;max-width:860px;margin:14px auto 0}.chat-heading h1{margin:0;font-size:20px}#newChatButton{padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.7);color:var(--green);cursor:pointer}.conversation{max-width:860px;margin:18px auto 30px;display:flex;flex-direction:column;gap:20px}.chat-user-row{display:flex;justify-content:flex-end}.chat-user-bubble{max-width:min(78%,620px);padding:13px 17px;border:1px solid rgba(255,255,255,.9);border-radius:20px 20px 5px 20px;background:rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(50,45,38,.05);white-space:pre-wrap;overflow-wrap:anywhere}.chat-assistant-row{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start}.assistant-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:13px;background:#e3ebe4;color:var(--green);font-size:12px;font-weight:750}.assistant-content{min-width:0;padding:4px 0 10px}.turn-message{margin:0 0 10px;color:#69736c;font-size:14px}.turn-answer{margin:0 0 14px;color:#273c30;font-size:16px;line-height:1.75}.turn-result:empty{display:none}.turn-result table{margin-top:12px}.turn-export{margin:10px 0;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.78);color:var(--green);cursor:pointer}.turn-export:disabled{opacity:.5;cursor:not-allowed}.turn-plan{margin-top:12px}.turn-plan pre{max-height:300px}.turn-chart{margin:18px 0}.turn-chart h2{margin:6px 0;font-size:17px}.turn-chart .chart-bar{background:#3f765d}.turn-thinking:before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:#588369;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25;transform:scale(.75)}}
    .turn-chart .chart-note{color:var(--muted);font-size:13px}.chart-row{display:grid;grid-template-columns:minmax(100px,220px) minmax(0,1fr) 72px;gap:12px;align-items:center;margin:13px 0}.chart-label{overflow-wrap:anywhere;font-size:14px}.chart-track{overflow:hidden;background:#e9edf0;border-radius:6px}.chart-bar{height:22px;border-radius:6px}.chart-count{text-align:right;font-variant-numeric:tabular-nums}.turn-result{overflow-x:auto}.turn-result table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.76)}.turn-result th,.turn-result td{border:1px solid #e0e5e9;padding:10px 12px;text-align:left;vertical-align:top}.turn-result th{background:#f0f3f5}.turn-result pre{max-height:360px;overflow:auto;background:#f1f3f2;padding:14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.turn-plan summary{cursor:pointer;color:#4d6558;font-weight:600}.chat-dock{position:fixed;z-index:4;left:264px;right:24px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 20px 14px;background:linear-gradient(180deg,rgba(244,240,235,0),rgba(244,240,235,.94) 28%,#f4f0eb 100%)}#askForm{width:min(820px,100%);display:flex;align-items:center;gap:12px;padding:9px 10px 9px 20px;border:1px solid rgba(255,255,255,.96);border-radius:25px;background:rgba(255,255,255,.93);box-shadow:0 12px 35px rgba(52,47,41,.14);backdrop-filter:blur(18px)}.search-icon{width:25px;height:25px;flex:0 0 auto;color:#858b90}#question{width:100%;min-width:0;height:46px;border:0;outline:0;color:var(--ink);background:transparent;font-size:16px}#question::placeholder{color:#858b90}#askButton{width:52px;height:52px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:17px;color:white;background:var(--green);cursor:pointer;transition:transform .2s,background .2s}#askButton:hover{transform:translateY(-1px);background:#183e2f}#askButton:disabled{opacity:.65;cursor:wait}#askButton svg{width:23px;height:23px}.composer-note{color:#828780;font-size:11px}
    @media(max-width:900px){.sidebar{width:202px}.main{margin-left:214px}.quick-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}.quick-card,.quick-card:first-child{min-height:112px;grid-row:auto;flex-direction:row}}
    @media(max-width:620px){.app-shell{padding:0}.sidebar{position:static;width:auto;inset:auto;margin:8px;padding:10px 12px;border-radius:18px}.brand{padding:3px 8px 9px;font-size:21px}.nav{display:flex;gap:4px;overflow-x:auto}.nav-link{min-height:40px;padding:0 10px;white-space:nowrap;font-size:13px}.nav-link svg{width:19px;height:19px}.sidebar-spacer,.side-dataset{display:none}.main{margin:8px;padding-bottom:128px}.hero{min-height:190px;border-radius:18px}.hero-copy strong{font-size:21px}.profile-link{top:16px;right:16px}.content{padding:16px 4px 24px}.quick-grid{grid-template-columns:1fr;gap:9px}.quick-card,.quick-card:first-child{min-height:96px}.dataset-strip{flex-wrap:wrap;gap:10px;padding:12px}.dataset-divider{display:none}.dataset-button{width:100%;margin-left:0}.chat-dock{left:8px;right:8px;padding:12px 8px 9px}#askForm{padding-left:13px;gap:7px;border-radius:20px}#question{font-size:14px}#askButton{width:46px;height:46px;border-radius:15px}.chat-heading{margin:12px 4px 0}.conversation{margin:14px 4px 25px;gap:14px}.chat-user-bubble{max-width:88%}.chat-assistant-row{grid-template-columns:31px minmax(0,1fr);gap:9px}.assistant-mark{width:30px;height:30px;border-radius:10px;font-size:10px}.chart-row{grid-template-columns:minmax(82px,125px) minmax(0,1fr) 55px;gap:8px}}
    .hero{min-height:calc(100dvh - 190px);border:0;background:transparent}
    .drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(880px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;border:0;border-left:1px solid var(--line);padding:26px;background:#f7f4ef;color:var(--ink);box-shadow:-16px 0 60px rgba(30,45,35,.12);overflow-y:auto}
    .drawer::backdrop{background:rgba(30,40,33,.28);backdrop-filter:blur(3px)}
    .drawer-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .drawer-heading h2{margin:0;font-size:21px}
    .drawer-close{border:1px solid var(--line);border-radius:12px;background:white;color:var(--green);padding:9px 15px;cursor:pointer}
    .drawer .quick-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}
    .drawer .quick-card,.drawer .quick-card:first-child{grid-row:auto;min-height:136px;flex-direction:column;padding-right:48px}
    .drawer .dataset-strip{flex-wrap:wrap}.drawer .dataset-button{margin-left:0}
    @media(max-width:900px) and (min-width:621px){.chat-dock{left:226px}}
    @media(max-width:620px){.drawer{padding:20px 14px}.drawer .quick-grid{grid-template-columns:1fr}.hero{min-height:calc(100dvh - 260px)}}

    .sidebar{overflow-y:auto}.history-panel{margin-top:18px;min-height:100px;overflow-y:auto;flex:1}.history-panel h2{font-size:13px;color:var(--muted);margin:0 8px 8px}#historyNotice{font-size:11px;color:var(--muted);line-height:1.6;padding:0 8px}.history-item{display:flex;align-items:center;border-radius:10px;margin:4px 0}.history-item.selected{background:#e4ebe3}.history-item button{border:0;background:transparent;cursor:pointer;color:var(--green);padding:8px 4px}.history-open{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.history-action{font-size:10px}#sideNewChat{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px;background:white;color:var(--green);cursor:pointer}.turn-answer{white-space:pre-wrap;overflow-wrap:anywhere}.evidence-note{font-size:12px;color:var(--muted);line-height:1.7}.source-card{padding:12px;margin:10px 0;background:#fff9;border:1px solid var(--line);border-radius:12px}.source-card h3{font-size:14px}.source-card p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.source-records{max-height:420px;overflow:auto}.source-records summary,.data-details summary{cursor:pointer;color:var(--green);padding:8px 0;font-size:14px}.data-details{margin:12px 0;border-top:1px solid var(--line)}button:disabled{cursor:wait;opacity:.5}@media(max-width:620px){.history-panel{max-height:140px}.history-item{max-width:100%}.sidebar-spacer{display:none}}

    .assistant-mark{background:linear-gradient(145deg,#fffaf0,#e5eddf);border:1px solid #d8e3d5;border-radius:14px;box-shadow:0 3px 10px #315e4810;overflow:visible}
    .assistant-mark svg{width:100%;height:100%;overflow:visible}.robot-eyes{transform-box:fill-box;transform-origin:center;animation:robot-blink 6s infinite}
    @keyframes robot-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
    @media(prefers-reduced-motion:reduce){.robot-eyes{animation:none}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/agent.html">DataAgent</a>
      <nav class="nav">
        <a class="nav-link active" href="/agent.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>智能分析</a>
        <a class="nav-link" href="#datasetInfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>数据概览</a>
        <a class="nav-link" href="#conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5m0 14h17M8 15l4-5 3 3 5-7"/></svg>可视化图表</a>
        <a class="nav-link" href="#quickAnalyses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>案例</a>
        <a class="nav-link" href="/docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4 1.8c-1 .8-1.7 1.2-1.7 2.7M12 17h.01"/></svg>关于与接口</a>
      </nav>
      <button id="sideNewChat" type="button">＋ 新建对话</button>
      <section class="history-panel" aria-label="历史对话"><h2>历史对话</h2><div id="historyList"></div><p id="historyNotice">仅保存在当前浏览器，最多20个对话。</p></section>
      <div class="sidebar-spacer"></div>
      <a class="side-dataset" href="#datasetInfo"><svg class="dataset-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span><strong>全球招聘岗位数据</strong><small id="sideRowCount">正在读取数据集…</small></span></a>
    </aside>
    <main class="main">
      <section class="hero" id="hero"><div class="hero-copy"><strong>让招聘数据回答你的问题</strong><span>输入岗位、技能、公司或国家，开始探索数据</span></div><a class="profile-link" href="/docs" aria-label="查看 API 文档"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4.1 3.4-6 8-6s7.3 1.9 8 6"/></svg></a></section>
      <div class="content">
        <section id="landing" hidden>
          <section id="quickAnalyses"><h2 class="section-heading">常用分析</h2><div class="quick-grid">
            <button class="quick-card tone-green" type="button" data-prompt="统计 country_clean 字段中岗位记录数最多的前5个国家"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20v-7h4v7M10 20V5h4v15M16 20v-11h4v11"/></svg></span><span class="card-copy"><strong>各国家岗位数量排名</strong><small>统计招聘岗位数量最多的国家</small></span><span class="card-arrow">→</span><span class="card-deco"><i></i><i></i><i></i></span></button>
            <button class="quick-card tone-blue" type="button" data-prompt="统计 company_name 字段中岗位记录数最多的前10家公司"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0-18"/></svg></span><span class="card-copy"><strong>招聘岗位最多的公司</strong><small>比较各家公司发布的岗位数量</small></span><span class="card-arrow">→</span></button>
            <button class="quick-card tone-sand" type="button" data-prompt="统计 title 字段中岗位记录数最多的前10个岗位名称"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-11-2 14"/></svg></span><span class="card-copy"><strong>热门岗位分布</strong><small>查看数据集中常见的岗位名称</small></span><span class="card-arrow">→</span><span class="card-deco"><i></i><i></i><i></i></span></button>
            <button class="quick-card tone-lilac" type="button" data-prompt="筛选 title 中包含 Data Analyst 的岗位记录"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="card-copy"><strong>Data Analyst 岗位</strong><small>筛选数据分析师相关招聘记录</small></span><span class="card-arrow">→</span></button>
            <button class="quick-card tone-sky" type="button" data-prompt="统计 country_clean 字段中岗位记录数最多的前10个国家"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg></span><span class="card-copy"><strong>国家别名归一统计</strong><small>使用清洗后的国家字段汇总记录</small></span><span class="card-arrow">→</span></button>
          </div></section>
          <section class="dataset-strip" id="datasetInfo"><span class="dataset-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></span><span class="dataset-label"><small>当前数据集</small><strong>全球招聘岗位数据</strong></span><span class="dataset-divider"></span><span class="dataset-count"><strong id="rowCount">加载中…</strong> 条岗位记录</span><button class="dataset-button" id="overviewButton" type="button">查看数据概览　›</button></section>
          <section id="overviewPanel" hidden aria-live="polite"><h3 id="datasetName">数据集概览</h3><p id="datasetStats"></p><p id="overviewMessage"></p><div id="columnList" aria-label="数据字段"></div></section>
          <p class="footnote">DataAgent · 基于当前招聘数据进行筛选与统计。结果范围取决于数据集和可用分析工具。</p>
        </section>

    function createTurn(question){

    function resetExport(ui){ui.exportRows=[];ui.exportButton.disabled=true;ui.exportButton.hidden=true}
    function prepareExport(value,ui){resetExport(ui);const rows=Array.isArray(value)?value:[value];if(!rows.length||!rows.every(row=>row&&typeof row==="object"&&!Array.isArray(row))||!rows.some(row=>Object.keys(row).length))return;ui.exportRows=rows;ui.exportButton.disabled=false;ui.exportButton.hidden=false}
    function csvCell(value,column){let text=value===null||value===undefined?"":displayValue(value,column);if(typeof value!=="number"&&(/^[\s\uFEFF]*[=+@-]/.test(text)||/^[\t\r\n]/.test(text)))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
    function buildCsv(rows){const columns=[...new Set(rows.flatMap(row=>Object.keys(row)))],lines=[columns.map(col=>csvCell(fieldName(col),"")).join(",")];for(const row of rows)lines.push(columns.map(col=>csvCell(row[col],col)).join(","));return "\uFEFF"+lines.join("\r\n")+"\r\n"}

    function renderPlan(plan,ui){const lines=(plan.tool_calls||[]).map((call,index)=>{const args=call.arguments||{},column=fieldName(args.column||"");let desc;if(call.name==="filter_rows")desc=`筛选「${column}」中包含「${displayValue(args.keyword,args.column)}」的记录。`;else if(call.name==="count_values")desc=`按「${column}」统计记录数，忽略缺失值，按数量从高到低取前 ${args.top_n??10} 项。`;else if(call.name==="summarize_numeric")desc=`计算「${column}」的有效数量、平均值、中位数、最小值和最大值。`;else desc="执行数据处理步骤。";return `第 ${index+1} 步：${desc}`});ui.plan.textContent=lines.join("\n\n");ui.planDetails.hidden=false}
    function renderAnswer(step,ui){const rows=step.result,column=step.arguments?.column;if(step.tool!=="count_values"||!column||!Array.isArray(rows)||!rows.length||!rows.every(row=>row&&Number.isFinite(row.count)))return;const highest=Math.max(...rows.map(row=>row.count)),leaders=rows.filter(row=>row.count===highest).map(row=>displayValue(row[column],column));ui.answer.textContent=`本次返回 ${rows.length} 项统计结果。其中，${leaders.join("、")}${leaders.length>1?"并列":""}最多，为 ${highest.toLocaleString("zh-CN")} 条记录。`;ui.answer.hidden=false}
    function renderChart(step,ui){const rows=step.result,column=step.arguments?.column;if(step.tool!=="count_values"||!column||!Array.isArray(rows)||!rows.length||!rows.every(row=>row&&Object.hasOwn(row,column)&&Number.isFinite(row.count)&&row.count>=0))return;const shown=[...rows].sort((a,b)=>b.count-a.count).slice(0,20),maximum=shown[0].count;ui.chart.append(make("h2","","岗位记录数对比"),make("p","chart-note","条形从 0 开始，长度表示记录数。"+(rows.length>20?"图表仅显示前 20 项，完整结果可导出 CSV。":"")));for(const row of shown){const item=make("div","chart-row"),label=make("span","chart-label",displayValue(row[column],column)),track=make("div","chart-track"),bar=make("div","chart-bar");track.setAttribute("aria-hidden","true");bar.style.width=`${maximum>0?row.count/maximum*100:0}%`;track.append(bar);item.append(label,track,make("span","chart-count",row.count.toLocaleString("zh-CN")));ui.chart.append(item)}ui.chart.hidden=false}
    function renderResult(value,ui){if(!Array.isArray(value)){const pre=make("pre");pre.textContent=value&&typeof value==="object"?Object.entries(value).map(([key,item])=>`${fieldName(key)}：${displayValue(item,key)}`).join("\n"):displayValue(value);ui.result.append(pre);prepareExport(value,ui);return}if(!value.length){ui.result.textContent="没有符合条件的记录。";return}const columns=[...new Set(value.flatMap(row=>Object.keys(row)))],table=document.createElement("table"),head=table.createTHead().insertRow();for(const column of columns){const cell=make("th","",fieldName(column));cell.scope="col";head.append(cell)}const body=table.createTBody(),visible=value.slice(0,200);for(const row of visible){const tr=body.insertRow();for(const column of columns)tr.insertCell().textContent=displayValue(row[column],column)}ui.result.append(table);if(value.length>visible.length)ui.result.append(make("p","turn-message",`结果共 ${value.length.toLocaleString("zh-CN")} 条，页面展示前 200 条；CSV 可导出完整结果。`));prepareExport(value,ui)}
    function beginChat(){landing.hidden=true;hero.hidden=true;chatHeading.hidden=false}
    const historyKey="dataagent.conversations.v1";
    let chats=[],activeId=null,busy=false;
    const historyList=document.getElementById("historyList"),historyNotice=document.getElementById("historyNotice");
    try{const saved=JSON.parse(localStorage.getItem(historyKey)||"{}");chats=Array.isArray(saved.chats)?saved.chats.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.turns)).slice(0,20):[];activeId=saved.activeId}catch{historyNotice.textContent="无法读取本地历史，本次仍可正常分析。"}
    function activeChat(){return chats.find(c=>c.id===activeId)}
    function saveHistory(){
      try{const snapshots=chats.slice(0,20).map(c=>({...c,turns:c.turns.slice(-30).map(t=>({question:t.question,error:t.error,data:t.data?compactData(t.data):null}))}));localStorage.setItem(historyKey,JSON.stringify({activeId,chats:snapshots}));historyNotice.textContent="仅保存在当前浏览器，最多20个对话。"}

    function compactData(data){

    }
    function renderHistory(){

        const row=make("div","history-item"+(chat.id===activeId?" selected":""));
        const open=make("button","history-open",chat.title||"新对话");open.type="button";open.title=chat.title||"新对话";open.disabled=busy;open.onclick=()=>openChat(chat.id);
        const rename=make("button","history-action","改名");rename.type="button";rename.disabled=busy;rename.setAttribute("aria-label","重命名对话");rename.onclick=()=>{const title=prompt("对话名称",chat.title||"");if(title&&title.trim()){chat.title=title.trim().slice(0,60);saveHistory()}};

    }
    function showEvidence(data,ui){
      const sources=data.evidence||[];
      if(!sources.length)return;
      const filtered=sources.find(s=>s.tool==="filter_rows");
      const note=filtered?`匹配 ${filtered.total_rows} 条岗位记录；文字分析参考其中 ${filtered.shown_rows} 条。${filtered.sampled?"这是部分样本，不代表全部岗位。":""}`:"依据本次查询的统计结果；排名仅覆盖返回的项目。";

      if(filtered){
        const records=make("details","source-records");records.append(make("summary","","查看原始岗位（本次参考样本）"));

        records.append(make("p","evidence-note","较长字段最多展示前3000个字符。"));ui.evidence.append(records);

    function showResult(data,ui){

    function openChat(id){

    function newChat(){if(busy)return;openChat(null);questionInput.value="";saveHistory();window.scrollTo({top:0,behavior:"smooth"})}
    document.getElementById("newChatButton").addEventListener("click",newChat);
    document.getElementById("sideNewChat").addEventListener("click",newChat);
    function setBusy(value){busy=value;sendButton.disabled=value;document.getElementById("newChatButton").disabled=value;document.getElementById("sideNewChat").disabled=value;document.querySelectorAll(".quick-card").forEach(b=>b.disabled=value);renderHistory()}
    let composing=false,compositionFinishedAt=-Infinity;

        if(!response.ok)throw new Error(`请求失败（HTTP ${response.status}）`);
        const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";
        try{while(true){const {done,value}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let split;while((split=buffer.indexOf("\n"))>=0){const line=buffer.slice(0,split);buffer=buffer.slice(split+1);if(line.trim())receive(JSON.parse(line))}if(done)break}if(buffer.trim())receive(JSON.parse(buffer))}finally{reader.releaseLock()}
        if(!complete)throw new Error("连接中断，回答未完成，请重试。");
      }catch(error){turn.error=`分析未完成：${error.message}`;ui.message.classList.remove("turn-thinking");ui.message.textContent=turn.error;ui.message.style.color="#a33b35"}
      finally{setBusy(false);saveHistory();questionInput.focus()}
    });
    openChat(activeId);

  </script>
</body>
